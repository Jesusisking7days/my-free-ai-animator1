<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenAnimate Studio v2</title>
    <!-- Stable Tailwind CSS Engine -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #0a0b0d; color: #e2e8f0; font-family: sans-serif; }
        .dark-box { background-color: #111318; border: 1px solid #1f2937; }
        .input-box { background-color: #171921; border: 1px solid #374151; }
        .terminal-box { background-color: rgba(0,0,0,0.4); border: 1px solid #1f2937; color: #10b981; font-family: monospace; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-6">

    <!-- Header Navbar -->
    <header class="dark-box px-6 py-4 flex items-center justify-between shadow-md rounded-xl mb-6">
        <h1 class="text-xl font-black tracking-wider text-white">OPEN<span class="text-cyan-400">ANIMATE v2</span></h1>
        <span class="text-xs font-mono bg-cyan-950 border border-cyan-500/30 text-cyan-400 px-3 py-1 rounded-full">Unlimited Free Generation</span>
    </header>

    <!-- Content Workspace Grid -->
    <div class="max-w-7xl w-full mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Controls Column (Left) -->
        <div class="space-y-5 dark-box p-5 rounded-2xl flex flex-col shadow-xl">
            <div>
                <label class="block text-xs uppercase tracking-widest text-cyan-400 font-bold mb-2">Anime / Scene Prompt</label>
                <textarea id="promptInput" class="w-full h-24 input-box rounded-xl p-3 text-sm text-white focus:outline-none focus:border-cyan-400 resize-none transition-all" placeholder="Example: Naruto Uzumaki executing a Rasengan attack, intense aura..."></textarea>
            </div>

            <!-- Image Reference Upload Area -->
            <div>
                <label class="block text-xs uppercase tracking-widest text-cyan-400 font-bold mb-2">Character Reference Image (Optional)</label>
                <div class="relative border-2 border-dashed border-gray-700 hover:border-cyan-500/50 rounded-xl p-4 transition-all input-box flex flex-col items-center justify-center text-center">
                    <input type="file" id="imageRef" accept="image/*" onchange="previewUploadedImage(event)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" style="z-index: 10;" />
                    <div id="uploadPlaceholder" class="space-y-1 text-xs text-gray-400">
                        <p class="font-medium text-gray-300">Click to upload reference look</p>
                        <p class="text-[10px] text-gray-500">Matches colors & structural composition</p>
                    </div>
                    <img id="imagePreview" class="hidden max-h-20 rounded-lg border border-gray-700 shadow-md" />
                </div>
            </div>

            <div>
                <label class="block text-xs uppercase tracking-widest text-cyan-400 font-bold mb-2">Artistic Preset</label>
                <select id="stylePreset" class="w-full input-box rounded-xl p-3 text-sm text-white focus:outline-none focus:border-cyan-400">
                    <option value="modern digital anime key visual, colorful cel-shading, Ufotable studio style, trending on Pixiv">Vibrant Modern Anime</option>
                    <option value="90s vintage anime aesthetic, grainy film look, hand-painted retro backgrounds, cell animation">Classic 90s Vintage Anime</option>
                    <option value="cinematic rendering, dynamic landscape view, hyper detailed masterpiece">Cinematic Masterpiece</option>
                </select>
            </div>

            <button onclick="launchV2Pipeline()" class="w-full bg-gradient-to-r from-cyan-400 to-blue-500 text-slate-950 font-black py-3 rounded-xl tracking-wider uppercase text-xs transition-all transform active:scale-95 shadow-lg cursor-pointer" style="position: relative; z-index: 20;">
                Generate Production Sequences
            </button>

            <!-- Console Log -->
            <div class="flex flex-col">
                <label class="block text-xs uppercase tracking-widest text-cyan-400 font-bold mb-1.5">Agent Pipeline Log</label>
                <div id="terminalBox" class="terminal-box h-32 rounded-xl p-3 text-[11px] overflow-y-auto space-y-1">
                    <div class="text-gray-500">&gt; Studio engine loaded. Awaiting directive...</div>
                </div>
            </div>
        </div>

        <!-- Output Timeline (Right) -->
        <div class="lg:col-span-2 dark-box p-5 rounded-2xl flex flex-col shadow-xl min-h-[400px]">
            <h3 class="text-xs uppercase tracking-widest text-gray-400 font-bold mb-4">Live Multi-Shot Timeline Output</h3>
            
            <div id="timelineTrack" class="grid grid-cols-1 sm:grid-cols-2 gap-4 flex-1 overflow-y-auto">
                <div id="emptyState" class="col-span-full flex flex-col items-center justify-center text-center text-gray-500 p-12 border border-dashed border-gray-800 rounded-xl my-auto">
                    <p class="text-sm font-semibold text-gray-400">No Sequence Active</p>
                    <p class="text-xs text-gray-600 max-w-xs mt-1">Input your concepts on the left panel to execute your generation sequence.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function previewUploadedImage(event) {
            const input = event.target;
            const preview = document.getElementById('imagePreview');
            const placeholder = document.getElementById('uploadPlaceholder');
            
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function launchV2Pipeline() {
            const userPrompt = document.getElementById('promptInput').value.trim();
            const chosenStyle = document.getElementById('stylePreset').value;
            const terminal = document.getElementById('terminalBox');
            const track = document.getElementById('timelineTrack');
            const emptyState = document.getElementById('emptyState');

            if (!userPrompt) {
                alert("Please drop your animation vision script details first!");
                return;
            }

            if (emptyState) emptyState.remove();
            track.innerHTML = '';
            terminal.innerHTML = '';

            function appendLog(agent, msg, colorClass = "text-gray-300") {
                const row = document.createElement('div');
                row.className = colorClass;
                row.innerHTML = `<span class="text-purple-400 font-bold">[${agent}]</span> ${msg}`;
                terminal.appendChild(row);
                terminal.scrollTop = terminal.scrollHeight;
            }

            try {
                appendLog("Scriptwriter-Agent", "Analyzing query syntax parameters...");
                await new Promise(r => setTimeout(r, 600));

                const shotSequences = [
                    { id: 1, title: "Establishing Close-up", promptModifier: "close up portrait focusing on facial expressions" },
                    { id: 2, title: "Dynamic Action Arc", promptModifier: "action camera angle, epic battle dynamic staging view" }
                ];
                appendLog("Director-Core", "Generated 2 sequential episodic camera layers.", "text-cyan-400");

                for (let shot of shotSequences) {
                    appendLog("Artist-Agent", `Compiling variables for shot: ${shot.title}...`);

                    const block = document.createElement('div');
                    block.className = "input-box rounded-xl overflow-hidden p-3 flex flex-col space-y-2.5";
                    block.innerHTML = `
                        <div class="flex items-center justify-between border-b border-gray-800 pb-1.5 text-[10px]">
                            <span class="text-cyan-400 font-bold">${shot.title.toUpperCase()}</span>
                            <span id="badge-${shot.id}" class="text-amber-400">Rendering Node...</span>
                        </div>
                        <div id="view-${shot.id}" class="w-full aspect-video bg-black rounded-lg flex items-center justify-center text-xs text-gray-500">
                            Rendering asset frames...
                        </div>
                        <p class="text-[11px] text-gray-400 p-2 rounded font-mono bg-black/45">${userPrompt}, ${shot.promptModifier}</p>
                    `;
                    track.appendChild(block);

                    const masterQueryString = encodeURIComponent(`${userPrompt}, ${shot.promptModifier}, ${chosenStyle}`);
                    const seedRandomizer = Math.floor(Math.random() * 99999);
                    const targetImageURL = `https://pollinations.ai{masterQueryString}?width=1024&height=576&seed=${seedRandomizer}&nologo=true`;

                    await new Promise((resolve, reject) => {
                        const loaderImg = new Image();
                        loaderImg.src = targetImageURL;
                        loaderImg.onload = () => {
                            const outputContainer = document.getElementById(`view-${shot.id}`);
                            outputContainer.innerHTML = `<img src="${targetImageURL}" style="width:100%; height:100%; object-fit:cover;" alt="Rendered Frame" />`;
                            
                            const badge = document.getElementById('badge-' + shot.id);
