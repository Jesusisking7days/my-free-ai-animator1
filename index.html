<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenAnimate Studio v2</title>
    <!-- Stable Global Stylesheets -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { background-color: #0b0c10; color: #c5c6c7; font-family: system-ui, -apple-system, sans-serif; }
        .studio-card { background-color: #1f2833; border: 1px solid #2f3e46; }
        .input-box { background-color: #0b0c10; border: 1px solid #45f3ff; color: #ffffff; }
        .input-box:focus { border-color: #00b4d8; outline: none; }
        .terminal-box { background-color: #000000; border: 1px solid #2f3e46; color: #00ffcc; font-family: monospace; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-6">

    <!-- Header Navbar -->
    <header class="studio-card px-6 py-4 flex items-center justify-between shadow-xl rounded-xl mb-6">
        <h1 class="text-xl font-black tracking-wider text-white">OPEN<span class="text-cyan-400">ANIMATE v2</span></h1>
        <span class="text-xs font-mono bg-black/40 border border-cyan-500/30 text-cyan-400 px-3 py-1 rounded-full">Server Cost: $0.00 / Free Forever</span>
    </header>

    <!-- Main Workspace Layout -->
    <div class="max-w-7xl w-full mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Input Frame Column -->
        <div class="space-y-5 studio-card p-5 rounded-2xl flex flex-col shadow-2xl">
            <div>
                <label class="block text-xs uppercase tracking-widest text-cyan-400 font-bold mb-2">Anime / Scene Prompt</label>
                <textarea id="promptInput" class="w-full h-24 input-box rounded-xl p-3 text-sm resize-none" placeholder="Type scene concept here..."></textarea>
            </div>

            <button onclick="processStudioLayer()" class="w-full bg-gradient-to-r from-cyan-400 to-blue-500 text-slate-900 font-black py-3 rounded-xl tracking-wider uppercase text-xs shadow-md cursor-pointer hover:opacity-95" style="position: relative; z-index: 50;">
                RUN ANIMATION STUDIO ENGINE
            </button>

            <!-- Console Log Output Terminal -->
            <div class="flex flex-col flex-1">
                <label class="block text-xs uppercase tracking-widest text-cyan-400 font-bold mb-1.5">Agent Pipeline Log</label>
                <div id="terminalBox" class="terminal-box h-32 rounded-xl p-3 text-xs overflow-y-auto space-y-1">
                    <div class="text-gray-500">&gt; Studio engine initialized. Ready to render.</div>
                </div>
            </div>
        </div>

        <!-- Visual Tracking Output -->
        <div class="lg:col-span-2 studio-card p-5 rounded-2xl flex flex-col shadow-xl min-h-[450px]">
            <h3 class="text-xs uppercase tracking-widest text-gray-400 font-bold mb-4">Live Multi-Shot Timeline Output</h3>
            
            <div id="timelineTrack" class="grid grid-cols-1 sm:grid-cols-2 gap-4 flex-1 overflow-y-auto">
                <div id="emptyState" class="col-span-full flex flex-col items-center justify-center text-center text-gray-500 p-12 border border-dashed border-gray-800 rounded-xl my-auto">
                    <p class="text-sm font-semibold text-gray-400">No Sequence Active</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function processStudioLayer() {
            const promptValue = document.getElementById('promptInput').value.trim();
            const terminal = document.getElementById('terminalBox');
            const track = document.getElementById('timelineTrack');
            const emptyState = document.getElementById('emptyState');

            if (!promptValue) {
                alert("Please type a script prompt first!");
                return;
            }

            if (emptyState) emptyState.remove();
            track.innerHTML = '';
            terminal.innerHTML = '';

            function logStatus(agent, msg) {
                const el = document.createElement('div');
                el.innerHTML = `<span class="text-purple-400 font-bold">[${agent}]</span> ${msg}`;
                terminal.appendChild(el);
            }

            logStatus("Director-Agent", "Compiling production instructions...");
            
            const scenes = [
                { id: 1, title: "Scene Shot 1", text: "close up portrait visual" },
                { id: 2, title: "Scene Shot 2", text: "epic action framing cinematic view" }
            ];

            for (let shot of scenes) {
                logStatus("Artist-Agent", `Rendering ${shot.title}...`);

                const card = document.createElement('div');
                card.className = "input-box rounded-xl overflow-hidden p-3 flex flex-col space-y-2";
                
                const stringParts = promptValue + ", " + shot.text + ", anime key visual masterpiece, vibrant colors";
                const cleanPrompt = encodeURIComponent(stringParts);
                const randomSeed = Math.floor(Math.random() * 99999);
                const finalImgURL = "https://pollinations.ai" + cleanPrompt + ".jpg?width=1024&height=576&seed=" + randomSeed + "&nologo=true";

                // Clean direct image injection with loader parameters to completely clear proxy timeouts
                card.innerHTML = `
                    <div class="flex items-center justify-between border-b border-gray-800 pb-1 text-xs">
                        <span class="text-cyan-400 font-bold">${shot.title}</span>
                    </div>
                    <div id="box-${shot.id}" class="w-full aspect-video bg-black rounded-lg overflow-hidden flex items-center justify-center">
                        <img src="${finalImgURL}" style="width:100%; height:100%; object-fit:cover;" class="rounded" alt="Drawing artwork assets..." />
                    </div>
                `;
                track.appendChild(card);
                logStatus("Video-Renderer", `${shot.title} layer stream connected.`);
            }
        }
    </script>
</body>
</html>
