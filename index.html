<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenAnimate Studio v2</title>
    <!-- Stable CSS Stylesheet Framework -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { background-color: #0b0c10; color: #c5c6c7; font-family: system-ui, -apple-system, sans-serif; }
        .studio-card { background-color: #1f2833; border: 1px solid #2f3e46; }
        .input-box { background-color: #0b0c10; border: 1px solid #45f3ff; color: #ffffff; }
        .input-box:focus { border-color: #00b4d8; outline: none; }
        .terminal-box { background-color: #000000; border: 1px solid #2f3e46; color: #00ffcc; font-family: monospace; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #45f3ff; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-6">

    <!-- Header Navbar Area -->
    <header class="studio-card px-6 py-4 flex items-center justify-between shadow-xl rounded-xl mb-6">
        <h1 class="text-xl font-black tracking-wider text-white">OPEN<span class="text-cyan-400">ANIMATE v2</span></h1>
        <span class="text-xs font-mono bg-black/40 border border-cyan-500/30 text-cyan-400 px-3 py-1 rounded-full">Server Cost: $0.00 / Free Forever</span>
    </header>

    <!-- Workspace Controls Grid Layout -->
    <div class="max-w-7xl w-full mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Controls Column (Left) -->
        <div class="space-y-5 studio-card p-5 rounded-2xl flex flex-col shadow-2xl">
            <div>
                <label class="block text-xs uppercase tracking-widest text-cyan-400 font-bold mb-2">Anime / Scene Prompt</label>
                <textarea id="promptInput" class="w-full h-24 input-box rounded-xl p-3 text-sm resize-none" placeholder="Example: Naruto Uzumaki executing a Rasengan attack, intense aura..."></textarea>
            </div>

            <!-- Character Upload Attachment Module -->
            <div>
                <label class="block text-xs uppercase tracking-widest text-cyan-400 font-bold mb-2">Character Reference Image (Optional)</label>
                <div class="relative border-2 border-dashed border-gray-700 rounded-xl p-4 input-box flex flex-col items-center justify-center text-center cursor-pointer">
                    <input type="file" id="imageRef" accept="image/*" onchange="previewUploadedImage(event)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" style="z-index: 10;" />
                    <div id="uploadPlaceholder" class="space-y-1 text-xs text-gray-400">
                        <p class="font-medium text-gray-200">Click to attach look photo</p>
                        <p class="text-[10px] text-gray-500">Extracts style colors matching frame</p>
                    </div>
                    <img id="imagePreview" class="hidden max-h-20 rounded-lg border border-gray-700 shadow-md mt-1" />
                </div>
            </div>

            <div>
                <label class="block text-xs uppercase tracking-widest text-cyan-400 font-bold mb-2">Style Presets</label>
                <select id="stylePreset" class="w-full input-box rounded-xl p-3 text-sm">
                    <option value="modern digital anime key visual, colorful cel-shading, Ufotable studio style, trending on Pixiv">Vibrant Modern Anime</option>
                    <option value="90s vintage anime aesthetic, grainy film look, hand-painted retro backgrounds, cell animation">Classic 90s Vintage Anime</option>
                    <option value="cinematic rendering, dynamic landscape view, hyper detailed masterpiece">Cinematic Masterpiece</option>
                </select>
            </div>

            <button onclick="launchV2Pipeline()" class="w-full bg-gradient-to-r from-cyan-400 to-blue-500 text-slate-900 font-black py-3 rounded-xl tracking-wider uppercase text-xs transition-all shadow-md cursor-pointer hover:opacity-90" style="position: relative; z-index: 20;">
                Generate Production Sequences
            </button>

            <!-- Status Monitoring Operations Console Logs -->
            <div class="flex flex-col flex-1">
                <label class="block text-xs uppercase tracking-widest text-cyan-400 font-bold mb-1.5">Agent Pipeline Log</label>
                <div id="terminalBox" class="terminal-box h-32 rounded-xl p-3 text-xs overflow-y-auto space-y-1 custom-scrollbar">
                    <div class="text-gray-500">&gt; Studio engine engine loaded. Awaiting directive...</div>
                </div>
            </div>
        </div>

        <!-- Timeline Production Track Output (Right) -->
        <div class="lg:col-span-2 studio-card p-5 rounded-2xl flex flex-col shadow-xl min-h-[450px]">
            <h3 class="text-xs uppercase tracking-widest text-gray-400 font-bold mb-4">Live Multi-Shot Timeline Output</h3>
            
            <div id="timelineTrack" class="grid grid-cols-1 sm:grid-cols-2 gap-4 flex-1 overflow-y-auto custom-scrollbar">
                <div id="emptyState" class="col-span-full flex flex-col items-center justify-center text-center text-gray-500 p-12 border border-dashed border-gray-800 rounded-xl my-auto">
                    <p class="text-sm font-semibold text-gray-400">No Sequence Active</p>
                    <p class="text-xs text-gray-600 max-w-xs mt-1">Input your concepts on the left panel to execute your generation sequence.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function previewUploadedImage(event) {
            const input = event.target;
            const preview = document.getElementById('imagePreview');
            const placeholder = document.getElementById('uploadPlaceholder');
            
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function launchV2Pipeline() {
            const userPrompt = document.getElementById('promptInput').value.trim();
            const chosenStyle = document.getElementById('stylePreset').value;
            const terminal = document.getElementById('terminalBox');
            const track = document.getElementById('timelineTrack');
            const emptyState = document.getElementById('emptyState');

            if (!userPrompt) {
                alert("Please drop your animation vision script details first!");
                return;
            }

            if (emptyState) emptyState.remove();
            track.innerHTML = '';
            terminal.innerHTML = '';

            function appendLog(agent, msg, colorClass = "text-gray-300") {
                const row = document.createElement('div');
                row.className = colorClass;
                row.innerHTML = `<span class="text-purple-400 font-bold">[${agent}]</span> ${msg}`;
                terminal.appendChild(row);
                terminal.scrollTop = terminal.scrollHeight;
            }

            try {
                appendLog("Scriptwriter-Agent", "Analyzing query syntax parameters...");
                await new Promise(r => setTimeout(r, 600));

                const shotSequences = [
                    { id: 1, title: "Establishing Close-up", promptModifier: "close up portrait focusing on facial expressions" },
                    { id: 2, title: "Dynamic Action Arc", promptModifier: "action camera angle, epic battle dynamic staging view" }
                ];
                appendLog("Director-Core", "Generated 2 sequential episodic camera layers.", "text-cyan-400");

                for (let shot of shotSequences) {
                    appendLog("Artist-Agent", `Compiling variables for shot: ${shot.title}...`);

                    const block = document.createElement('div');
                    block.className = "input-box rounded-xl overflow-hidden p-3 flex flex-col space-y-2.5";
                    block.innerHTML = `
                        <div class="flex items-center justify-between border-b border-gray-800 pb-1.5 text-xs font-mono">
                            <span class="text-cyan-400 font-bold">${shot.title.toUpperCase()}</span>
                            <span id="badge-${shot.id}" class="text-yellow-400 animate-pulse">Rendering Node...</span>
                        </div>
                        <div id="view-${shot.id}" class="w-full aspect-video bg-black rounded-lg flex items-center justify-center text-xs text-gray-500">
                            Rendering asset frames...
                        </div>
                        <p class="text-xs text-gray-400 p-2 rounded font-mono bg-black/40">${userPrompt}, ${shot.promptModifier}</p>
                    `;
                    track.appendChild(block);

                    // Refactored URL query clean string to route perfectly through public cluster channels
                    const cleanPrompt = encodeURIComponent(`${userPrompt}, ${shot.promptModifier}, ${chosenStyle}`);
                    const seedRandomizer = Math.floor(Math.random() * 99999);
                    const targetImageURL = `https://pollinations.ai{cleanPrompt}?width=1024&height=576&seed=${seedRandomizer}&nologo=true`;

                    await new Promise((resolve, reject) => {
                        const loaderImg = new Image();
                        loaderImg.src = targetImageURL;
                        loaderImg.onload = () => {
