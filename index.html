<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenAnimate Studio v3 — Cinematic Video Hub</title>
    <!-- Stable High-Quality CSS Frameworks -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { 
            background: radial-gradient(circle at center, #0f111a 0%, #05060b 100%); 
            color: #e2e8f0; 
            font-family: system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }
        /* Glassmorphic Pro UI Cards */
        .cyber-card { 
            background: rgba(17, 20, 32, 0.65); 
            backdrop-filter: blur(14px); 
            border: 1px solid rgba(6, 182, 212, 0.15); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .cyber-input { 
            background: rgba(9, 10, 15, 0.8); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: #ffffff; 
            transition: all 0.3s ease;
        }
        .cyber-input:focus { 
            border-color: #06b6d4; 
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.25);
            outline: none; 
        }
        .glow-text {
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.6);
        }
        .glow-button {
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glow-button:hover {
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.45);
            transform: translateY(-1px);
        }
        .terminal-text { 
            background-color: #040508; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            color: #10b981; 
            font-family: monospace; 
        }
        /* Custom Tracking Scrollbar */
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(6, 182, 212, 0.3); border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-8">

    <!-- Top Glow Navigation Header Bar -->
    <header class="cyber-card px-8 py-4 flex flex-col sm:flex-row items-center justify-between rounded-2xl mb-8 border-b border-cyan-500/20">
        <div class="flex items-center space-x-3 mb-2 sm:mb-0">
            <div class="w-3 h-3 bg-cyan-400 rounded-full animate-ping"></div>
            <h1 class="text-2xl font-black tracking-widest text-white uppercase">OPEN<span class="text-cyan-400 glow-text">ANIMATE v3</span></h1>
        </div>
        <div class="flex items-center space-x-4">
            <span class="text-xs font-mono bg-cyan-950/50 border border-cyan-500/30 text-cyan-400 px-4 py-1.5 rounded-full uppercase tracking-wider">AI Video Production Mode Enabled</span>
            <span class="text-xs font-mono bg-gray-900 border border-gray-800 text-gray-400 px-4 py-1.5 rounded-full">$0.00 Server Fee</span>
        </div>
    </header>

    <!-- Main Workspace Alignment Grid -->
    <div class="max-w-7xl w-full mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
        
        <!-- Controls Console Panel (Left Column) -->
        <div class="space-y-6 cyber-card p-6 rounded-3xl flex flex-col shadow-2xl">
            <div>
                <label class="block text-xs uppercase tracking-widest text-cyan-400 font-extrabold mb-2">Cinematic Scene / Anime Prompt</label>
                <textarea id="promptInput" class="w-full h-28 cyber-input rounded-2xl p-4 text-sm resize-none custom-scroll" placeholder="Example: Naruto Uzumaki activating Sage Mode, red fiery aura, professional anime key frame visual, masterpiece..."></textarea>
            </div>

            <div>
                <label class="block text-xs uppercase tracking-widest text-cyan-400 font-extrabold mb-2">Motion Preset Engine</label>
                <select id="motionPreset" class="w-full cyber-input rounded-2xl p-4 text-sm appearance-none cursor-pointer">
                    <option value="cinematic panning camera, fast action motion sequence, dynamic animation look">Dynamic Action Clip</option>
                    <option value="slow-motion dramatic close up portrait scene, soft wind blowing details">Dramatic Slow-Motion</option>
                    <option value="hyperspeed camera tracking sequence, explosive energy particles flowing around">Energy Rush Sequence</option>
                </select>
            </div>

            <button onclick="launchVideoPipeline()" class="w-full glow-button text-slate-950 font-black py-4 rounded-2xl tracking-widest uppercase text-xs shadow-lg cursor-pointer transform active:scale-95">
                COMPILE & RENDER AI VIDEO
            </button>

            <!-- Live Automation Multi-Agent Logs Terminal -->
            <div class="flex flex-col flex-1">
                <label class="block text-xs uppercase tracking-widest text-cyan-400 font-extrabold mb-2">Agent Production Stream Logs</label>
                <div id="terminalBox" class="terminal-text h-40 rounded-2xl p-4 text-xs overflow-y-auto space-y-1.5 custom-scroll">
                    <div class="text-gray-500">&gt; Animation environment initialized. Server cluster online. Ready.</div>
                </div>
            </div>
        </div>

        <!-- Live Video Timeline Output Track (Right Columns) -->
        <div class="lg:col-span-2 cyber-card p-6 rounded-3xl flex flex-col shadow-2xl min-h-[530px]">
            <div class="flex items-center justify-between border-b border-gray-800 pb-4 mb-6">
                <h3 class="text-xs uppercase tracking-widest text-gray-400 font-black">Live Video Track Timeline Sequence</h3>
                <span class="w-2 h-2 rounded-full bg-emerald-400 shadow-md"></span>
            </div>
            
            <div id="timelineTrack" class="grid grid-cols-1 sm:grid-cols-2 gap-6 flex-1 overflow-y-auto custom-scroll max-h-[500px]">
                <!-- Default Idle Canvas Placeholder View -->
                <div id="emptyState" class="col-span-full flex flex-col items-center justify-center text-center text-gray-500 p-16 border-2 border-dashed border-gray-800 rounded-2xl my-auto">
                    <svg class="w-12 h-12 mb-3 text-cyan-500/40 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    <p class="text-base font-bold text-gray-400 tracking-wide">Studio Timeline Idle</p>
                    <p class="text-xs text-gray-600 max-w-xs mt-1 font-mono">Input your animation concepts on the left and tap render to start streaming live AI video assets.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function launchVideoPipeline() {
            const promptValue = document.getElementById('promptInput').value.trim();
            const motionPreset = document.getElementById('motionPreset').value;
            const terminal = document.getElementById('terminalBox');
            const track = document.getElementById('timelineTrack');
            const emptyState = document.getElementById('emptyState');

            if (!promptValue) {
                alert("Please type out your scene script description concept details first!");
                return;
            }

            if (emptyState) emptyState.remove();
            track.innerHTML = '';
            terminal.innerHTML = '';

            function logStatus(agent, msg, colorClass = "text-gray-300") {
                const el = document.createElement('div');
                el.className = colorClass;
                el.innerHTML = `<span class="text-purple-400 font-bold">[${agent}]</span> ${msg}`;
                terminal.appendChild(el);
                terminal.scrollTop = terminal.scrollHeight;
            }

            logStatus("Director-Core", "Parsing prompt strings and executing layout setups...");
            await new Promise(r => setTimeout(r, 600));
            
            const clips = [
                { id: 1, title: "Shot Sequence 01", mod: "establishing wide angle cinematic keyframe look" },
                { id: 2, title: "Shot Sequence 02", mod: "dynamic detailed camera rotation view panning shot" }
            ];

            for (let shot of clips) {
                logStatus("Scriptwriter-Agent", `Compiling variables and properties for ${shot.title}...`);

                const card = document.createElement('div');
                card.className = "cyber-input rounded-2xl overflow-hidden p-4 flex flex-col space-y-3 border border-gray-800 relative group transition-all hover:border-cyan-500/30 shadow-md shadow-black/50";
                
                // Formulate the modern video API string target path directly
                const masterString = promptValue + ", " + shot.mod + ", " + motionPreset + ", 8k resolution anime studio aesthetic masterpiece";
                const cleanQuery = encodeURIComponent(masterString);
                const seedValue = Math.floor(Math.random() * 99999);
                
                // ROUTING SYSTEM DIRECTLY SECURELY INTO FREE VIDEO GENERATION NETWORKS
                const finalVideoURL = "https://pollinations.ai" + cleanQuery + "?width=1024&height=576&seed=" + seedValue + "&nologo=true&feed=true&model=video";

                card.innerHTML = `
                    <div class="flex items-center justify-between border-b border-gray-800/80 pb-2 text-[11px] font-mono">
                        <span class="text-cyan-400 font-black tracking-wider">${shot.title.toUpperCase()}</span>
